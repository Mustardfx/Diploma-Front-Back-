version: '3.8'

services:
  db:
    build: .
    env_file: .env
    container_name: sportportal-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - sportportal-db_data:/var/lib/postgresql/data

